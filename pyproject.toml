[project]
name = "iris-photos"
version = "0.1.0"
description = "Iris - local-first AI photo indexing, annotation and search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "platformdirs>=4.3",
    "blake3>=1.0",
    "pillow>=11.1",
    "pillow-heif>=0.21",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "numpy>=2.0",
    "rawpy>=0.24",
]

[project.optional-dependencies]
ml = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.49",
    "onnxruntime-gpu>=1.20",
    "insightface>=0.7.3",
    "lancedb>=0.18",
    "scikit-learn>=1.6",
    "hdbscan>=0.8.40",
]

[project.scripts]
pa = "pa.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

# PyPI's torch wheels bundle the CUDA runtime on Linux only -- the Windows wheel
# is CPU-only (122MB vs 526MB), so `uv sync --extra ml` on Windows yields a build
# where torch.cuda.is_available() is False regardless of the hardware. That also
# breaks face detection, since pa/providers/_cuda.py finds onnxruntime's CUDA
# libraries by borrowing the ones torch vendors. PyTorch publishes the CUDA
# builds on its own index instead; cu130 covers Blackwell (sm_120).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.uv]
# insightface depends on the CPU-only `onnxruntime` package. Installed alongside
# `onnxruntime-gpu` it shares the same import path and shadows the GPU build's
# provider registration, leaving only CPUExecutionProvider available and making
# face detection ~10x slower. This override drops the CPU requirement so only
# onnxruntime-gpu is ever installed.
override-dependencies = ["onnxruntime ; sys_platform == 'no-such-platform'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Query()/Depends() in argument defaults is FastAPI's intended style, not a bug.
"pa/api/app.py" = ["B008"]
# Typer declares CLI arguments the same way; the call in the default IS the API.
"pa/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
